<title>Construction Document Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: 248px sidebar on surface + 60px header + content on canvas, max 1200px. Tokens: CareerMerge design system. */
:root{
  --canvas:#0a0a0c; --surface:#141518; --sunken:#1b1c21; --hover:#23242b;
  --border:#2a2b32; --border-strong:#3a3c45;
  --ink:#ededf0; --ink-2:#b6b8c0; --ink-3:#8f929c;
  --accent:#8d90f6; --accent-hover:#a5a8f9; --accent-soft:#22234a; --accent-ink:#bfc1ff; --on-accent:#0e0f12;
  --success:#5fc48e; --success-soft:#15291e; --warning:#e3aa52; --warning-soft:#2e2413; --danger:#f08178; --danger-soft:#341a19;
  --scrim:rgba(0,0,0,0.6);
  --shadow-card:0 1px 2px rgba(0,0,0,0.3);
  --shadow-raised:0 8px 24px rgba(0,0,0,0.45);
  --shadow-overlay:0 24px 64px rgba(0,0,0,0.6);
  --wave-glow:#16171c; --wave-band:rgba(255,255,255,0.022); --wave-band-2:rgba(255,255,255,0.016); --wave-line:rgba(255,255,255,0.05);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gutter:32px; --rail:64px; --rail-open:240px;
  color-scheme:dark;
}
/* Single committed dark look: the same tokens apply whatever the viewer's theme. */
.waves{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 80% at 50% 35%,var(--wave-glow) 0%,var(--canvas) 70%)}
.wave-layer{position:absolute;inset:0;animation:wave-sway 26s ease-in-out infinite alternate}
.wave-layer svg{position:absolute;top:0;left:0;width:200%;height:100%;animation:wave-drift 80s linear infinite}
.wave-layer:nth-child(2){animation-duration:34s;animation-delay:-9s}
.wave-layer:nth-child(2) svg{animation-duration:110s;animation-direction:reverse}
.wave-layer:nth-child(3){animation-duration:21s;animation-delay:-4s}
.wave-layer:nth-child(3) svg{animation-duration:62s}
@keyframes wave-drift{to{transform:translateX(-50%)}}
@keyframes wave-sway{from{transform:translateY(-3%)}to{transform:translateY(3%)}}
@media (prefers-reduced-motion: reduce){.wave-layer,.wave-layer svg{animation:none}}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:21px;-webkit-font-smoothing:antialiased}
#root{width:100%;min-height:100vh;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)} a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px;line-height:18px}
.num{font-variant-numeric:tabular-nums}
.overline{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.display{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.02em}
.heading{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.small{font-size:13px;line-height:18px}
.muted{color:var(--ink-3)} .secondary{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:550;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s ease-out,border-color .15s ease-out}
.btn-primary{background:var(--accent);color:var(--on-accent)} .btn-primary:hover:not(:disabled){background:var(--accent-hover);color:var(--on-accent)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--ink)} .btn-secondary:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink-2);font-weight:500} .btn-ghost:hover:not(:disabled){background:var(--hover)}
.btn-sm{height:32px;padding:0 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-card)}
.pad{padding:20px}
.stack{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--success-soft);color:var(--success)}
.b-neutral{background:var(--sunken);color:var(--ink-2)}
.b-accent{background:var(--accent-soft);color:var(--accent-ink)}
.b-warn{background:var(--warning-soft);color:var(--warning)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;background:var(--sunken);color:var(--ink-2)}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor;flex:none}
.well{background:var(--sunken);border-radius:8px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:8px;font-size:13px;line-height:18px}
.notice svg{flex:none;margin-top:1px}
.n-neutral{background:var(--sunken);color:var(--ink-2)}
.n-warn{background:var(--warning-soft);color:var(--ink)}
.n-danger{background:var(--danger-soft);color:var(--ink)}
.n-accent{background:var(--accent-soft);color:var(--ink)}
.input{height:40px;box-sizing:border-box;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;width:100%}
textarea.input{height:auto;padding:10px 12px;line-height:21px;resize:vertical}
.input[readonly]{background:var(--sunken);font-family:var(--mono);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:18px;font-weight:500}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--ink-2);cursor:pointer}
.chip:hover{background:var(--hover);color:var(--ink)}
.skel{background:var(--sunken);border-radius:6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}*{transition:none!important}}

/* shell */
.app{position:relative;z-index:1;display:flex;width:100%;min-height:100vh;min-height:100dvh}
.sidebar{position:fixed;top:0;bottom:0;left:0;z-index:36;width:calc(var(--rail) + env(safe-area-inset-left,0px));box-sizing:border-box;background:var(--surface);border-right:1px solid var(--border);padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:24px;overflow:hidden;transition:width .24s ease-out,box-shadow .24s ease-out}
.sidebar.expanded{width:calc(var(--rail-open) + env(safe-area-inset-left,0px));box-shadow:var(--shadow-overlay)}
.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;opacity:0;transition:opacity .14s ease-out}
.sidebar.expanded .lbl{opacity:1;transition-delay:.08s}
.brand{display:flex;align-items:center;gap:10px;height:40px;padding:0 4px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-weight:600;line-height:18px;text-align:left;cursor:pointer;width:100%;flex:none}
.brand:hover{background:var(--hover)}
.logo{width:32px;height:32px;flex:none;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.rail-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--ink-2);font-size:14px;text-align:left;cursor:pointer;width:100%;flex:none}
.nav button svg,.rail-item svg,.proj-link svg{flex:none}
.nav button:hover,.rail-item:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:550}
.proj-link{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--ink-2);text-align:left;cursor:pointer;width:100%}
.proj-link:hover,.proj-link.on{background:var(--sunken)}
.identity{margin-top:auto;border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.id-row{display:flex;align-items:center;gap:10px;padding-left:4px}
.avatar{width:32px;height:32px;flex:none;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.rail-tip{position:fixed;left:calc(var(--rail) + 8px + env(safe-area-inset-left,0px));transform:translateY(-50%);z-index:37;padding:6px 10px;border-radius:6px;background:var(--hover);border:1px solid var(--border-strong);color:var(--ink);font-size:12px;line-height:16px;white-space:nowrap;box-shadow:var(--shadow-raised);pointer-events:none}
.main{position:relative;z-index:1;flex:1 1 auto;min-width:0;margin-left:calc(var(--rail) + env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.floating{position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:35;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding:6px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-raised);max-width:calc(100vw - var(--rail) - 32px)}
.content{width:100%;max-width:1200px;box-sizing:border-box;padding-block:84px 64px;padding-left:var(--gutter);padding-right:max(var(--gutter),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
@media (max-width:720px){:root{--gutter:16px}.content{padding-block:120px 48px}}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
th{background:var(--sunken);text-align:left;padding:10px 12px;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
td{padding:12px;border-top:1px solid var(--border);vertical-align:top;color:var(--ink-2)}
th:first-child,td:first-child{padding-left:20px} th:last-child,td:last-child{padding-right:20px}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--hover)}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-weight:550;cursor:pointer;text-align:left;font-size:14px}
.link-btn:hover{color:var(--accent-hover);text-decoration:underline}
.ns{color:var(--ink-3);font-style:italic}

/* segmented + tabs */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg label{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.seg label.on{border-color:var(--accent);background:var(--accent-soft)}
.seg label.off{opacity:.6;cursor:not-allowed}
.seg input{margin:3px 0 0;accent-color:var(--accent)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:8px;background:var(--sunken)}
.tabs button{height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:550;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}
.checkbox{display:flex;align-items:center;gap:8px;cursor:pointer}
.checkbox input{width:16px;height:16px;margin:0;accent-color:var(--accent)}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex}
.drawer{margin-left:auto;width:100%;max-width:480px;height:100%;box-sizing:border-box;background:var(--surface);box-shadow:var(--shadow-overlay);border-radius:16px 0 0 16px;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px 24px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;animation:slide .24s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dialog{margin:120px auto auto;width:calc(100% - 32px);max-width:440px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-overlay);padding:24px;display:flex;flex-direction:column;gap:16px}
.icon-btn{width:36px;height:36px;flex:none;border:0;border-radius:8px;background:var(--sunken);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--hover)}
blockquote{margin:0}
.quote{padding:16px;border-radius:8px;background:var(--sunken);font-size:15px;line-height:23px;color:var(--ink)}
dl.meta{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 12px;font-size:14px;line-height:20px}
dl.meta dt{color:var(--ink-3)} dl.meta dd{margin:0}
.popover{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-raised);padding:16px;display:flex;flex-direction:column;gap:14px}
.switch{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{appearance:none;flex:none;width:34px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;cursor:pointer;margin-top:1px;transition:background .15s ease-out}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:var(--surface);transition:transform .15s ease-out}
.switch input:checked{background:var(--accent)} .switch input:checked::after{transform:translateX(14px)}
.metric{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .3s ease-out}
mark{background:var(--warning-soft);color:inherit;border-radius:3px;padding:0 1px}
</style>

/* Background: slow flowing ribbons, low contrast. Periods divide 1440 so the 200%-wide SVG loops seamlessly. */
function ribbon(base, amp, period, phase, thick, amp2, phase2) {
  const top = [], bot = [];
  for (let x = 0; x <= 2880; x += 24) {
    const t = (2 * Math.PI * x) / period;
    top.push(x + ',' + (base + amp * Math.sin(t + phase)).toFixed(1));
    bot.push(x + ',' + (base + thick + amp2 * Math.sin(t + phase2)).toFixed(1));
  }
  return 'M' + top.join(' L') + ' L' + bot.reverse().join(' L') + ' Z';
}
function line(base, amp, period, phase) {
  const pts = [];
  for (let x = 0; x <= 2880; x += 24) pts.push(x + ',' + (base + amp * Math.sin((2 * Math.PI * x) / period + phase)).toFixed(1));
  return 'M' + pts.join(' L');
}

    <div className="popover" ref={ref} role="dialog" aria-label="Demo simulation controls">
      <div className="stack" style={{ gap: 2 }}>
        <span className="overline">Demo simulation</span>
        <span className="small secondary">Prototype controls for the local mock backend. They change no project data.</span>
      </div>
      <div className="stack" style={{ gap: 8, paddingBottom: 12, borderBottom: '1px solid var(--border)' }}>
        <div className="row" style={{ justifyContent: 'space-between', gap: 12 }}>
          <span className="stack" style={{ gap: 2 }}><span className="small" style={{ fontWeight: 550 }}>Live index (hybrid search)</span><span className="muted" style={{ fontSize: 12, lineHeight: '16px' }}>{sim.liveIndex ? 'Built · hybrid available' : indexing ? 'Building live index…' : 'Not built · hybrid unavailable'}</span></span>
          {sim.liveIndex
            ? <button type="button" className="btn btn-ghost btn-sm" onClick={() => setSim({ ...sim, liveIndex: false })}>Remove</button>
            : <button type="button" className="btn btn-secondary btn-sm" onClick={buildIndex} disabled={indexing}>{indexing ? 'Building…' : 'Build live index'}</button>}
        </div>
      </div>
      <Sw k="chat" label="Live chat available" hint="Off: Ask is disabled with an explanation." />
      <Sw k="liveExtraction" label="Live extraction available" hint="Off: Analyse live is disabled." />
      <Sw k="searchError" label="Simulate search request error" hint="The next searches fail." />
      <Sw k="providerError" label="Simulate model provider error" hint="Ask and Analyse live fail." />
      <Sw k="mutations" label="Demo actions allowed for this identity" hint="Off: the mock backend rejects load and reset." />
    </div>
  );
}

}

function SearchPanel({ role, db, sim, search, setSearch }) {
  const hybridOk = sim.liveIndex;
  const mode = hybridOk ? search.mode : 'lexical';
  const run = async (q) => {
    const query = (q ?? search.query).trim();
    if (!query) { setSearch((s) => ({ ...s, status: 'idle', error: 'Enter words to search for.' })); return; }
    const id = Date.now();
    setSearch((s) => ({ ...s, query, status: 'loading', error: null, reqId: id }));
    try {
      const res = await api.search(role, db, { query, mode, history: search.history }, sim);
      setSearch((s) => s.reqId === id ? { ...s, status: res.results.length ? 'results' : 'empty', res } : s);
    } catch (e) { setSearch((s) => s.reqId === id ? { ...s, status: 'error', error: e.message } : s); }
  };
  const res = search.res;
  return (
    <section className="card pad stack" aria-labelledby="search-h" style={{ flex: '1 1 440px', minWidth: 0, gap: 16 }}>
      <div className="stack" style={{ gap: 4 }}>
        <h2 id="search-h" className="heading">Search documents</h2>
        <p className="small muted">Returns matching source passages. It does not write an answer.</p>
      </div>
      <form className="row" style={{ gap: 8, flexWrap: 'nowrap' }} onSubmit={(e) => { e.preventDefault(); run(); }}>
        <label htmlFor="search-q" className="sr">Search query</label>
        <input id="search-q" className="input" type="search" value={search.query} placeholder="e.g. inspection notice" onChange={(e) => setSearch((s) => ({ ...s, query: e.target.value }))} />
        <button type="submit" className="btn btn-primary" disabled={search.status === 'loading'}><IconSearch size={16} sw={1.8} />Search</button>
      </form>
      <div className="row" style={{ gap: 6 }}>
        <span className="small muted">Try:</span>
        {['inspection notice', 'safety footwear', 'hard hat', 'retention'].map((q) => <button key={q} type="button" className="chip" onClick={() => { setSearch((s) => ({ ...s, query: q })); run(q); }}>{q}</button>)}
      </div>
      <fieldset style={{ border: 0, margin: 0, padding: 0 }} className="stack">
        <legend className="overline" style={{ padding: 0, marginBottom: 8 }}>Search mode</legend>
        <div className="seg">
          <label className={mode === 'lexical' ? 'on' : ''} htmlFor="mode-lex">
            <input id="mode-lex" type="radio" name="mode" checked={mode === 'lexical'} onChange={() => setSearch((s) => ({ ...s, mode: 'lexical' }))} />
            <span className="stack" style={{ gap: 2 }}><span style={{ fontWeight: 550 }}>Lexical</span><span className="secondary" style={{ fontSize: 12, lineHeight: '16px' }}>Offline keyword search, no embeddings</span></span>
          </label>
          <label className={(mode === 'hybrid' ? 'on' : '') + (hybridOk ? '' : ' off')} htmlFor="mode-hyb">
            <input id="mode-hyb" type="radio" name="mode" checked={mode === 'hybrid'} disabled={!hybridOk} onChange={() => setSearch((s) => ({ ...s, mode: 'hybrid' }))} />
            <span className="stack" style={{ gap: 2 }}><span style={{ fontWeight: 550 }}>Hybrid</span><span className="secondary" style={{ fontSize: 12, lineHeight: '16px' }}>Vector + keyword, live query embeddings</span></span>
          </label>
        </div>
        {!hybridOk && <p className="row" style={{ gap: 8, marginTop: 8, fontSize: 12, lineHeight: '16px', color: 'var(--warning)', flexWrap: 'nowrap', alignItems: 'flex-start' }}><IconAlert size={14} sw={1.8} /><span>Hybrid unavailable — backend: “Live index not built for KYD001. Run live indexing to enable vector search.” (Build it from Demo simulation.)</span></p>}
        {hybridOk && mode === 'hybrid' && <p className="row" style={{ gap: 8, marginTop: 8, fontSize: 12, lineHeight: '16px', color: 'var(--ink-2)' }}><SimTag>Simulated embeddings</SimTag><span>Vector similarity is mocked with a local synonym list.</span></p>}
      </fieldset>
      <label className="checkbox" htmlFor="history">
        <input id="history" type="checkbox" checked={search.history} onChange={(e) => setSearch((s) => ({ ...s, history: e.target.checked }))} />Include superseded revisions (history)
      </label>

      <div className="stack" style={{ borderTop: '1px solid var(--border)', paddingTop: 16, gap: 12 }} aria-live="polite">
        {search.status === 'idle' && <p className="small muted">{search.error || 'Search covers revisions in force in the documents you can read.'}</p>}
        {search.status === 'loading' && (
          <div role="status" className="stack" style={{ gap: 10 }}>
            <span className="small secondary">Searching {search.history ? 'all loaded revisions' : 'revisions in force'} ({mode})…</span>
            <div className="skel" style={{ height: 64 }}></div><div className="skel" style={{ height: 64 }}></div>
          </div>
        )}
        {search.status === 'error' && (
          <div role="alert" className="stack" style={{ padding: 16, borderRadius: 8, background: 'var(--danger-soft)', gap: 8 }}>
            <span style={{ fontWeight: 550, color: 'var(--danger)' }}>Search request failed</span>
            <span className="small secondary">{search.error} Your query is kept.</span>
            <button type="button" className="btn btn-secondary btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => run()}>Retry search</button>
          </div>
        )}
        {(search.status === 'results' || search.status === 'empty') && res && (
          <div className="stack" style={{ gap: 4 }}>
            <div className="row" style={{ gap: '6px 12px' }}>
              <span style={{ fontWeight: 550 }}>{res.results.length} {res.results.length === 1 ? 'passage' : 'passages'}</span>
              <span className="badge b-accent">{res.mode === 'hybrid' ? 'Hybrid · vector + keyword' : 'Lexical · keyword, no embeddings'}</span>
            </div>
            <span className="muted" style={{ fontSize: 12, lineHeight: '16px' }}>Scope: {res.history ? 'in-force and superseded revisions' : 'revisions in force only'} · {res.docCount} documents you can read</span>
            {res.excluded.length > 0 && <span className="secondary" style={{ fontSize: 12, lineHeight: '16px' }}>Excluded: {res.excluded.length} superseded revision ({res.excluded.map((k) => k.replace('/', ' Revision ')).join(', ')}). Include history to search it.</span>}
          </div>
        )}
        {search.status === 'empty' && (
          <div className="well stack" style={{ padding: 20, gap: 4 }}>
            <span style={{ fontWeight: 550 }}>No matching passages</span>
            <span className="small secondary">Nothing you can read matched “{search.query}”. Try other words{search.history ? '' : ', or include superseded revisions'}.</span>
          </div>
        )}
        {search.status === 'results' && res && (
          <ul style={{ listStyle: 'none', margin: 0, padding: 0 }} className="stack">
            {res.results.map((r, i) => (
              <li key={r.rev + r.page + r.sec} style={{ border: '1px solid var(--border)', borderRadius: 8, padding: '12px 14px', marginTop: i ? 10 : 0 }} className="stack">
                <p style={{ color: 'var(--ink)' }}><Highlight text={r.text} terms={res.terms} /></p>
                <div className="row" style={{ gap: '6px 12px', marginTop: 8, fontSize: 12, lineHeight: '16px', color: 'var(--ink-2)' }}>
                  <StatusBadge inForce={r.inForce} />
                  <span className="mono" style={{ fontSize: 12, color: 'var(--ink)' }}>{r.file}</span>
                  <span>p. {r.page}</span>
                  <span>{r.stated ? 'Revision stated: ' + r.stated.replace('Revision ', '') : 'no revision stated'}</span>
                  <span className="muted">Stored as {r.stored}</span>
                </div>
                {r.supersession && <blockquote className="small secondary" style={{ marginTop: 8, padding: '8px 12px', borderRadius: 6, background: 'var(--sunken)' }}>“{r.supersession.quote}” <span className="muted">— {r.supersession.rev.doc} {r.supersession.rev.stated}, p. {r.supersession.page}</span></blockquote>}
              </li>
            ))}
          </ul>
        )}
      </div>
    </section>
  );
}

function AskPanel({ role, db, sim, ask, setAsk }) {
  const submit = async (q) => {
    const question = (q ?? ask.question).trim();
    if (!question) { setAsk((a) => ({ ...a, status: 'idle', hint: 'Type a question first.' })); return; }
    const id = Date.now();
    setAsk((a) => ({ ...a, question, status: 'waiting', reqId: id, hint: null }));
    try {
      const res = await api.ask(role, db, question, sim);
      setAsk((a) => a.reqId === id ? { ...a, status: res.insufficient ? 'insufficient' : 'answer', res, asked: question } : a);
    } catch (e) { setAsk((a) => a.reqId === id ? { ...a, status: 'error', error: e.message } : a); }
  };
  const disabled = !sim.chat;
  const res = ask.res;
  return (
    <section className="card pad stack" aria-labelledby="ask-h" style={{ flex: '1 1 440px', minWidth: 0, gap: 16 }}>
      <div className="row" style={{ justifyContent: 'space-between', gap: 8, alignItems: 'flex-start' }}>
        <div className="stack" style={{ gap: 4 }}>
          <h2 id="ask-h" className="heading">Ask project documents</h2>
          <p className="small muted">One question, answered from documents you can read. Each question is independent.</p>
        </div>
        <span className="pill" style={disabled ? null : { background: 'var(--warning-soft)', color: 'var(--warning)' }}><span className="dot"></span>{disabled ? 'Live model unavailable' : 'Model: simulated (mock)'}</span>
      </div>
      <form className="stack" style={{ gap: 12 }} onSubmit={(e) => { e.preventDefault(); submit(); }}>
        <label className="field" htmlFor="question">Question
          <textarea id="question" className="input" rows={3} value={ask.question} disabled={disabled} onChange={(e) => setAsk((a) => ({ ...a, question: e.target.value }))} placeholder="e.g. How much notice is needed before work is covered up?"></textarea>
        </label>
        <div className="row" style={{ gap: 6 }}>
          <span className="small muted">Try:</span>
          {['How much notice is needed before work is covered up for inspection?', 'What safety footwear is required?', 'What retention applies to interim payments?'].map((q) => (
            <button key={q} type="button" className="chip" disabled={disabled} onClick={() => { setAsk((a) => ({ ...a, question: q })); submit(q); }}>{q.length > 38 ? q.slice(0, 36) + '…' : q}</button>
          ))}
        </div>
        <div className="row" style={{ gap: '8px 12px' }}>
          <button type="submit" className="btn btn-primary" disabled={disabled || ask.status === 'waiting'}>{ask.status === 'waiting' ? 'Asking…' : 'Ask'}</button>
          <span className="muted" style={{ fontSize: 12, lineHeight: '16px', flex: '1 1 200px' }}>Searches with search_documents ({sim.liveIndex ? 'hybrid' : 'lexical'}) before answering. Access is applied by the backend; the model can’t widen it.</span>
        </div>
      </form>

      <div className="stack" style={{ borderTop: '1px solid var(--border)', paddingTop: 16, gap: 12 }} aria-live="polite">
        {disabled && (
          <div className="well stack" style={{ padding: 16, gap: 4 }}>
            <span style={{ fontWeight: 550 }}>Live answers are unavailable</span>
            <span className="small secondary">The live model is not configured, so questions can’t be sent. Search and the requirement register still work offline. (Turn it on in Demo simulation.)</span>
          </div>
        )}
        {!disabled && ask.status === 'idle' && <p className="small muted">{ask.hint || 'Answers cite the passages they come from. If the documents don’t say, the answer says so.'}</p>}
        {!disabled && ask.status === 'waiting' && (
          <div role="status" className="stack" style={{ gap: 10 }}>
            <span className="small secondary">Calling search_documents, then writing a simulated answer…</span>
            <div className="skel" style={{ height: 14, width: '92%' }}></div><div className="skel" style={{ height: 14, width: '78%' }}></div><div className="skel" style={{ height: 14, width: '54%' }}></div>
          </div>
        )}
        {!disabled && ask.status === 'error' && (
          <div role="alert" className="stack" style={{ padding: 16, borderRadius: 8, background: 'var(--danger-soft)', gap: 8 }}>
            <span style={{ fontWeight: 550, color: 'var(--danger)' }}>The model provider returned an error</span>
            <span className="small secondary">No answer was produced. {ask.error}</span>
            <button type="button" className="btn btn-secondary btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => submit()}>Try again</button>
          </div>
        )}
        {!disabled && (ask.status === 'answer' || ask.status === 'insufficient') && res && (
          <div className="row" style={{ gap: 8 }}>
            <SimTag>Simulated AI response</SimTag>
            <span className="muted" style={{ fontSize: 12, lineHeight: '16px' }}>Composed locally from mock passages — no live model was called.</span>
          </div>
        )}
        {!disabled && ask.status === 'insufficient' && res && (
          <div className="stack" style={{ padding: 16, borderRadius: 8, background: 'var(--warning-soft)', gap: 4 }}>
            <span style={{ fontWeight: 550, color: 'var(--warning)' }}>Not enough information</span>
            <span style={{ color: 'var(--ink)' }}>The available documents do not contain enough information to answer this question.</span>
            <span className="secondary" style={{ fontSize: 12, lineHeight: '16px' }}>search_documents returned {res.toolCall.returned ? 'no passage that covers the question' : 'no passages'}.</span>
          </div>
        )}
        {!disabled && ask.status === 'answer' && res && (
          <div className="stack" style={{ gap: 12 }}>
            <span className="overline">Answer</span>
            <p style={{ color: 'var(--ink)' }}>{res.answer.map((a, i) => <span key={i}>{a} <span className="badge b-accent" style={{ height: 18, padding: '0 5px' }}>{i + 1}</span>{i < res.answer.length - 1 ? ' ' : ''}</span>)}</p>
            <span className="overline">Sources</span>
            <ol style={{ margin: 0, padding: 0, listStyle: 'none' }} className="stack">
              {res.sources.map((s, i) => (
                <li key={i} className="well" style={{ display: 'flex', gap: 10, padding: '10px 12px', marginTop: i ? 8 : 0 }}>
                  <span className="badge b-accent" style={{ width: 22, padding: 0, justifyContent: 'center' }}>{i + 1}</span>
                  <span className="stack" style={{ gap: 2, minWidth: 0 }}>
                    <span className="small" style={{ color: 'var(--ink)' }}>“{s.text}”</span>
                    <span className="secondary" style={{ fontSize: 12, lineHeight: '16px' }}>{s.doc.name} {s.doc.id} · p. {s.page}, {s.sec} · {revName(s.rev)}</span>
                  </span>
                </li>
              ))}
            </ol>
            <span className="muted" style={{ fontSize: 12, lineHeight: '16px' }}>Tool call: search_documents(“{res.toolCall.query}”) · {res.toolCall.mode} · {res.toolCall.scope} · {res.toolCall.returned} passages</span>
          </div>
        )}
      </div>
    </section>
  );
}

function Register({ reg, openQuote, tab, setTab }) {
  const rows = tab === 'current' ? reg.current : reg.superseded;
  return (
    <section className="card" aria-labelledby="reg-h" style={{ overflow: 'hidden' }}>
      <div className="row" style={{ justifyContent: 'space-between', gap: 12, padding: '16px 20px', borderBottom: '1px solid var(--border)' }}>
        <div className="stack" style={{ gap: 2 }}>
          <h2 id="reg-h" className="heading">Requirement register</h2>
          <span className="small muted">Authored offline fixtures, checked against the source documents.</span>
        </div>
        <div className="tabs" role="tablist" aria-label="Requirement status">
          <button type="button" role="tab" aria-selected={tab === 'current'} onClick={() => setTab('current')}>Current <span className="num">{reg.current.length}</span></button>
          <button type="button" role="tab" aria-selected={tab === 'superseded'} onClick={() => setTab('superseded')}>Superseded history <span className="num">{reg.superseded.length}</span></button>
        </div>
      </div>
      {rows.length === 0 ? (
        <div className="stack" style={{ padding: '32px 20px', gap: 4, alignItems: 'center', textAlign: 'center' }}>
          <span style={{ fontWeight: 550 }}>No superseded requirements</span>
          <span className="small secondary">Requirements move here when a later revision explicitly supersedes their document.</span>
        </div>
      ) : (
        <div className="tbl-wrap">
          <table style={{ minWidth: 880 }}>
            <thead><tr><th scope="col">Requirement</th><th scope="col">Responsible</th><th scope="col">Deadline / notice</th><th scope="col">Source</th><th scope="col" style={{ textAlign: 'right' }}>Evidence</th></tr></thead>
            <tbody>

    <div className="card pad stack" style={{ gap: 8, alignItems: 'flex-start' }}>

  const pages = api.sourcePages(role, db, doc.current.key).map((p) => p.page);
  const total = Math.max(...pages);

/* ============================== Revisions ============================== */
function RevisionsPage({ role, db, revBusy, onLoad, onAskReset, sim }) {
  const events = api.revisionEvents(role, db);
  const reg = api.register(role, db);
  return (
    <>
      <div className="stack" style={{ gap: 8, maxWidth: 760 }}>
        <span className="overline">Revisions</span>
        <h1 className="display">What changed when a document was reissued</h1>
        <p className="secondary">A revision replaces an earlier one only when the new document says so explicitly — not because it was loaded later. Replaced requirements stay available as superseded history. Showing revisions for documents you can read.</p>
      </div>
      {events.length === 0 && (
        <section className="card stack" style={{ padding: '40px 24px', alignItems: 'center', textAlign: 'center', gap: 12 }}>
          <div style={{ width: 44, height: 44, borderRadius: 12, background: 'var(--sunken)', color: 'var(--ink-3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><IconHistory size={22} /></div>
          <h2 className="heading">No revisions loaded since the initial import</h2>
          <p className="secondary" style={{ maxWidth: 520 }}>This local demo includes one predefined reissue: Inspection Procedure IP-01 Revision B. Loading it updates current requirements and the default search scope. Reset restores Revision A.</p>
          <div className="row" style={{ gap: 8, justifyContent: 'center' }}>
            <button type="button" className="btn btn-primary" onClick={onLoad} disabled={!!revBusy}>{revBusy === 'load' ? 'Loading Revision B…' : 'Load next revision (demo)'}</button>
            <button type="button" className="btn btn-secondary" onClick={onAskReset} disabled={!!revBusy}>Reset local demo</button>
          </div>
          {!sim.mutations && <span className="muted" style={{ fontSize: 12, lineHeight: '16px' }}>Demo actions are switched off for this identity; the mock backend will reject them.</span>}
        </section>
      )}
      {events.map((ev) => {
        const history = reg.superseded.filter((q) => q.rev === ev.prev.key);
        const current = reg.current.filter((q) => q.rev === ev.next.key);
        const changed = history.map((h) => { const n = current.find((c) => c.text === h.text); return { h, n, diff: n && (n.due !== h.due || n.role !== h.role) }; });
        const nChanged = changed.filter((c) => c.diff).length;
        return (
          <React.Fragment key={ev.next.key}>
            <section className="card pad stack" style={{ gap: 20 }}>
              <div className="row" style={{ justifyContent: 'space-between', gap: 12, alignItems: 'flex-start' }}>
                <div className="stack" style={{ gap: 6 }}>
                  <div className="row" style={{ gap: 10 }}><h2 className="heading">{ev.doc.name}</h2><span className="mono secondary" style={{ padding: '2px 8px', borderRadius: 6, background: 'var(--sunken)' }}>{ev.doc.id}</span></div>
                  <div className="row" style={{ gap: 10 }}>
                    <span className="badge b-neutral" style={{ height: 24, fontSize: 14 }}>{ev.prev.stated}</span>
                    <span style={{ color: 'var(--ink-3)', display: 'flex' }} role="img" aria-label="replaced by"><IconArrow size={16} sw={1.8} /></span>
                    <span className="badge b-ok" style={{ height: 24, fontSize: 14 }}>{ev.next.stated} · in force</span>
                  </div>
                </div>
                <span className="small muted">Loaded {fmtTime(ev.loadedAt)} · {nChanged} changed, {history.length - nChanged} unchanged</span>
              </div>
              <div className="stack" style={{ gap: 8 }}>
                <span className="overline">Supersession statement</span>
                <blockquote style={{ padding: '14px 16px', borderRadius: 8, background: 'var(--accent-soft)', color: 'var(--ink)', fontSize: 15, lineHeight: '23px' }}>“{ev.next.supersession.quote}”<span style={{ display: 'block', marginTop: 4, fontSize: 12, lineHeight: '16px', color: 'var(--accent-ink)' }}>{ev.doc.id} {ev.next.stated} · p. {ev.next.supersession.page} · Document status</span></blockquote>
              </div>
              {changed.filter((c) => c.diff).map(({ h, n }) => (
                <div key={h.id} className="stack" style={{ gap: 8 }}>
                  <span className="overline">Changed requirement · {h.text.replace(/\.$/, '').toLowerCase()}</span>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 16 }}>
                    <div className="stack well" style={{ border: '1px solid var(--border)', padding: 16, gap: 10 }}>
                      <div className="row" style={{ justifyContent: 'space-between', gap: 8 }}><span className="small secondary" style={{ fontWeight: 550 }}>Old · {ev.prev.stated}</span><span className="badge" style={{ background: 'var(--surface)', color: 'var(--ink-2)' }}>Superseded</span></div>
                      <span className="metric" style={{ color: 'var(--ink-2)', textDecoration: 'line-through', textDecorationThickness: 2 }}>{h.due.replace('’ notice', '')}</span>
                      <p className="small secondary">“{h.quote}”</p>
                      <span className="muted" style={{ fontSize: 12, lineHeight: '16px' }}>{ev.doc.id} {ev.prev.stated} · p. {h.page}, {h.sec}</span>
                    </div>
                    <div className="stack" style={{ border: '1px solid var(--accent)', borderRadius: 8, padding: 16, gap: 10, background: 'var(--surface)' }}>
                      <div className="row" style={{ justifyContent: 'space-between', gap: 8 }}><span className="small" style={{ fontWeight: 550 }}>New · {ev.next.stated}</span><span className="badge b-ok">Current</span></div>
                      <span className="metric">{n.due.replace('’ notice', '')}</span>
                      <p className="small">“{n.quote}”</p>
                      <span className="secondary" style={{ fontSize: 12, lineHeight: '16px' }}>{ev.doc.id} {ev.next.stated} · p. {n.page}, {n.sec}</span>
                    </div>
                  </div>
                </div>
              ))}
              <div className="notice n-neutral"><span><strong style={{ fontWeight: 600, color: 'var(--ink)' }}>Effect:</strong> current requirements and default search now use {ev.next.stated}. {ev.prev.stated} passages remain searchable with “Include superseded revisions (history)”.</span></div>
            </section>
            <section className="card" aria-labelledby={'hist-' + ev.doc.id} style={{ overflow: 'hidden' }}>
              <div className="stack" style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', gap: 2 }}>
                <h2 id={'hist-' + ev.doc.id} className="heading">Superseded history · {ev.doc.id} {ev.prev.stated}</h2>
                <span className="small muted">{history.length} requirements kept for reference. Not part of the current register.</span>
              </div>
              <ul style={{ listStyle: 'none', margin: 0, padding: '0 20px' }}>
                {changed.map(({ h, n, diff }, i) => (
                  <li key={h.id} className="row secondary" style={{ borderTop: i ? '1px solid var(--border)' : 0, padding: '12px 0', gap: '6px 20px', alignItems: 'baseline' }}>
                    <span style={{ flex: '3 1 360px', minWidth: 0 }}>{h.text}{h.due ? ' — ' + h.due : ''}</span>
                    <span className="small" style={{ flex: '1 1 160px' }}>{diff ? 'Changed in ' + ev.next.stored + ': ' + n.due : 'Unchanged in ' + ev.next.stored}</span>
                    <span className="muted" style={{ fontSize: 12 }}>Rev {ev.prev.stored} · p. {h.page}</span>
                  </li>
                ))}
              </ul>
            </section>
          </React.Fragment>
        );
      })}
    </>
  );
}

/* ============================== Overlays ============================== */
function useEscape(fn) { useEffect(() => { const k = (e) => { if (e.key === 'Escape') fn(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, [fn]); }
function Drawer({ title, overline, onClose, children }) {
  useEscape(onClose);
  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  return (
    <div className="scrim" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <aside className="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-h">
        <div className="row" style={{ justifyContent: 'space-between', gap: 12, alignItems: 'flex-start', flexWrap: 'nowrap' }}>
          <div className="stack" style={{ gap: 4 }}><span className="overline">{overline}</span><h2 id="drawer-h" className="heading">{title}</h2></div>
          <button ref={ref} type="button" className="icon-btn" aria-label="Close" onClick={onClose}><IconX size={16} sw={1.8} /></button>
        </div>
        {children}
      </aside>
    </div>
  );
}
function EvidenceDrawer({ q, db, onClose, openDoc }) {
  const by = supersederOf(db, q.rev);
  return (
    <Drawer overline="Source evidence" title={q.text} onClose={onClose}>
      <blockquote className="quote">“{q.quote}”</blockquote>
      <dl className="meta">
        <dt>Document</dt><dd>{q.doc.name} <span className="mono muted">{q.doc.id}</span></dd>
        <dt>Page</dt><dd>p. {q.page}, {q.sec}</dd>
        <dt>Revision</dt><dd>{q.revision.stated || <span>no revision stated <span className="muted">(stored {q.revision.stored})</span></span>}</dd>
        <dt>Status</dt><dd>{by ? 'Superseded by ' + by.stated : 'Current'}</dd>
        <dt>Responsible</dt><dd>{q.role || <NotStated />}</dd>
        <dt>Deadline</dt><dd>{q.due || <NotStated />}</dd>
      </dl>
      {by && <blockquote className="small secondary" style={{ padding: '10px 12px', borderRadius: 6, background: 'var(--sunken)' }}>“{by.supersession.quote}” <span className="muted">— {by.stated}, p. {by.supersession.page}</span></blockquote>}
      <div className="notice n-neutral"><IconInfo /><span>Quotation from the authored offline register, checked against the synthetic source.</span></div>
      <button type="button" className="btn btn-secondary" style={{ alignSelf: 'flex-start' }} onClick={() => { onClose(); openDoc(q.doc.id); }}>Open document details</button>
    </Drawer>
  );
}
function SourceDrawer({ role, db, revKey, onClose }) {
  const pages = api.sourcePages(role, db, revKey);
  const rev = revByKey(revKey);
  if (!pages) return <Drawer overline="Source file" title="Not available" onClose={onClose}><p className="secondary">This file doesn’t exist or your demo identity can’t read it.</p></Drawer>;
  const byPage = {};
  pages.forEach((p) => { (byPage[p.page] = byPage[p.page] || []).push(p); });
  return (
    <Drawer overline="Source file · synthetic" title={rev.file} onClose={onClose}>
      <div className="notice n-neutral"><IconInfo /><span>Text of the synthetic PDF for {DOCS[rev.doc].name}, {revName(rev)}. No real file is downloaded in this demo.</span></div>
      {Object.keys(byPage).map((n) => (
        <section key={n} className="stack" style={{ gap: 8 }}>
          <span className="overline">Page {n}</span>
          <div className="well stack" style={{ padding: 16, gap: 10 }}>{byPage[n].map((p, i) => <p key={i} className="small" style={{ color: 'var(--ink)' }}>{p.text}</p>)}</div>
        </section>
      ))}
    </Drawer>
  );
}
function ConfirmReset({ onCancel, onConfirm }) {
  useEscape(onCancel);
  return (
    <div className="scrim" onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-h">
        <h2 id="reset-h" className="heading">Reset local demo?</h2>
        <p className="secondary">This rebuilds the initial demo at Revision A. Any revision loaded since the initial import is removed from this local demo.</p>
        <div className="row" style={{ justifyContent: 'flex-end', gap: 8 }}>
          <button type="button" className="btn btn-secondary" onClick={onCancel} autoFocus>Cancel</button>
          <button type="button" className="btn btn-primary" onClick={onConfirm}>Reset to Revision A</button>
        </div>
      </div>
    </div>
  );
}

  const [ask, setAsk] = useState(initialAsk);
  const [regTab, setRegTab] = useState('current');
  const [live, setLive] = useState({});
  const mainRef = useRef(null);

  const go = (s) => { setScreen(s); setQuote(null); setSource(null); if (mainRef.current) mainRef.current.scrollTop = 0; window.scrollTo(0, 0); };
  const openDoc = (id) => { setDocId(id); go('document'); };
  const signIn = (r) => { setRole(r); setLastRole(r); setScreen('overview'); setSearch(initialSearch()); setAsk(initialAsk()); setLive({}); setRegTab('current'); };
  const signOut = () => { setRole(null); setQuote(null); setSource(null); setConfirm(false); };
  // project data changed → results computed against the old state are stale
  const invalidate = () => { setSearch((s) => ({ ...s, status: 'idle', res: null, error: 'Revision state changed. Run the search again.' })); setAsk((a) => ({ ...a, status: 'idle', res: null })); setLive({}); };

  const loadNext = async () => {
    setRevBusy('load'); setRevError(null);
    try { const r = await api.loadNextRevision(role, db, sim); setDb(r); invalidate(); }
    catch (e) { setRevError(e.message); }
    finally { setRevBusy(null); }
  };
  const doReset = async () => {
    setConfirm(false); setRevBusy('reset'); setRevError(null);
    try { const r = await api.reset(role, sim); setDb(r); invalidate(); setRegTab('current'); setSearch((s) => ({ ...s, history: false })); }
    catch (e) { setRevError(e.message); }
    finally { setRevBusy(null); }
  };
  const buildIndex = async () => { setIndexing(true); await delay(1600); setIndexing(false); setSim((s) => ({ ...s, liveIndex: true })); };

  // first visit to the project runs the pre-filled search so the panel opens in a working state
  const ranFirst = useRef(false);
  useEffect(() => {
    if (role && screen === 'project' && !ranFirst.current && search.status === 'idle' && !search.res) {
      ranFirst.current = true;
      setSearch((s) => ({ ...s, status: 'loading', reqId: 1 }));
      api.search(role, db, { query: search.query, mode: 'lexical', history: false }, sim)
        .then((res) => setSearch((s) => s.reqId === 1 ? { ...s, status: res.results.length ? 'results' : 'empty', res } : s))
        .catch((e) => setSearch((s) => s.reqId === 1 ? { ...s, status: 'error', error: e.message } : s));
    }
  }, [role, screen]);
  useEffect(() => { ranFirst.current = false; }, [role]);
  useEffect(() => { document.title = role ? { overview: 'Overview', project: 'KYD001', document: docId, revisions: 'Revisions' }[screen] + ' · Construction Document Assistant' : 'Construction Document Assistant'; }, [role, screen, docId]);

  if (!role) return <><Waves />{landing ? <Landing onStart={() => setLanding(false)} /> : <SignIn onSignIn={signIn} initialRole={lastRole} />}</>;

  return (
    <div className="app">
      <Waves />
      <Sidebar role={role} screen={screen} go={go} onSwitch={signOut} />
      <main className="main" ref={mainRef}>
        <div className="content">
          {revError && (
            <div role="alert" className="notice n-danger" style={{ alignItems: 'center' }}>
              <IconAlert /><span style={{ flex: 1 }}><strong style={{ fontWeight: 600, color: 'var(--danger)' }}>Demo action rejected.</strong> {revError}</span>
              <button type="button" className="icon-btn" aria-label="Dismiss" onClick={() => setRevError(null)} style={{ width: 28, height: 28, background: 'transparent' }}><IconX size={14} sw={1.8} /></button>
            </div>
          )}
          {screen === 'overview' && <Overview role={role} db={db} go={go} />}
          {screen === 'project' && <Project role={role} db={db} sim={sim} go={go} openDoc={openDoc} openQuote={setQuote} search={search} setSearch={setSearch} ask={ask} setAsk={setAsk} regTab={regTab} setRegTab={setRegTab} />}
          {screen === 'document' && <DocumentPage role={role} db={db} sim={sim} docId={docId} go={go} openQuote={setQuote} openSource={setSource} live={live} setLive={setLive} />}
          {screen === 'revisions' && <RevisionsPage role={role} db={db} revBusy={revBusy} onLoad={loadNext} onAskReset={() => setConfirm(true)} sim={sim} />}
        </div>
      </main>
      <TopBar db={db} revBusy={revBusy} onLoad={loadNext} onAskReset={() => setConfirm(true)} sim={sim} setSim={setSim} indexing={indexing} buildIndex={buildIndex} />
      {quote && <EvidenceDrawer q={quote} db={db} onClose={() => setQuote(null)} openDoc={openDoc} />}
      {source && <SourceDrawer role={role} db={db} revKey={source} onClose={() => setSource(null)} />}
      {confirm && <ConfirmReset onCancel={() => setConfirm(false)} onConfirm={doReset} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
