# Construction Document Assistant demo: ONE FICTIONAL PROJECT with synthetic
# documents. Every document under documents/ is generated by
# backend/app/demo/generate.py from backend/app/demo/construction_content.py
# and says on its first line that it is synthetic and not for construction use.
# Schema: demo-manifest/v1 (backend/app/connectors/demo.py), the same as the
# inherited university corpus: "institution" is the fictional organisation,
# a "course" is the project, a "resource" a document, a "version" a revision
# (version 1 = Revision A, version 2 = Revision B).
schema_version: demo-manifest/v1
institution:
  key: demo-contractor
  name: Demo Contractor Ltd (fictional)
  fictional: true
# The first import sees each document as it was at this time; revisions
# issued later arrive through the demo's "load next revision" sync.
initial_sync_at: 2026-10-05T08:00:00Z
users:
  - user_ref: demo-user
    courses: [kyd001]
courses:
  - ref: kyd001
    code: KYD001
    title: Kestrel Yard Depot Extension (fictional)
    resources:
      - key: inspection-procedure
        type: procedure
        title: Inspection Procedure IP-01
        active_version: 2
        versions:
          - version: 1
            file: documents/IP-01_Inspection_Procedure_RevA.pdf
            published_at: 2026-09-14T09:00:00Z
          - version: 2
            file: documents/IP-01_Inspection_Procedure_RevB.pdf
            published_at: 2026-10-20T09:00:00Z
      - key: site-safety-rules
        type: safety_rules
        title: Site Safety Rules SSR-01
        active_version: 1
        versions:
          - version: 1
            file: documents/SSR-01_Site_Safety_Rules.pdf
            published_at: 2026-09-14T09:30:00Z
      - key: commercial-terms
        type: contract
        title: Commercial Terms CT-01
        active_version: 1
        versions:
          - version: 1
            file: documents/CT-01_Commercial_Terms.pdf
            published_at: 2026-09-21T09:00:00Z
